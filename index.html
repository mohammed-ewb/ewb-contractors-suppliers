<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engineers Without Borders - Contractors and Suppliers</title>
<style>
:root{--r:#e31e24;--ink:#222;--mut:#666}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f4f4f4;color:#222;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#bgLogo{position:fixed;left:50%;top:54%;width:min(560px,62vw);margin-left:calc(min(560px,62vw) / -2);margin-top:-300px;z-index:0;pointer-events:none;perspective:1200px;animation:bob 7s ease-in-out infinite}

header{display:flex;align-items:center;gap:18px;padding:14px 26px;background:linear-gradient(180deg,#fff,#f0f0f0);backdrop-filter:blur(14px);border-bottom:3px solid #e31e24;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:drop 1s .6s both cubic-bezier(.2,.9,.2,1)}
.logoPlate{background:#fff;border-radius:12px;padding:5px 10px;box-shadow:0 0 0 1px #ddd,0 8px 24px rgba(0,0,0,.2);transform:rotateY(-12deg);transition:.5s}
.logoPlate:hover{transform:rotateY(12deg) scale(1.06)}
.logoPlate img{height:44px;display:block}
.ttl{flex:1}.ttl b{display:block;font-size:20px;letter-spacing:.5px;color:#222}.ttl span{font-size:13px;color:var(--mut)}
.count{padding:6px 14px;border-radius:99px;border:1px solid #ccc;font-size:13px;color:#555}.count b{color:#e31e24}
.btn{cursor:pointer;border:0;color:#fff;font:inherit;font-weight:700;padding:11px 20px;border-radius:12px;background:linear-gradient(135deg,#f0353b,#b3181d);box-shadow:0 8px 24px rgba(227,30,36,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:.25s}

.bar{padding:20px 26px 6px;animation:drop 1s .8s both cubic-bezier(.2,.9,.2,1)}
.search{position:relative;max-width:820px;margin:0 auto}
.search input{width:100%;padding:17px 22px 17px 56px;font:inherit;font-size:17px;color:#222;background:#fff;border:1px solid #ccc;border-radius:18px;outline:0;box-shadow:0 14px 36px rgba(0,0,0,.16);transition:.3s}

.search i{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-style:normal;font-size:20px;color:#e31e24}

.nm{font-weight:800;font-size:16px;line-height:1.25;word-break:break-word}

.rows div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rows b{color:#111;font-weight:600}

@keyframes fly{from{opacity:0;transform:translateZ(-700px) translateY(80px) rotateX(35deg)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotateX(-20deg)}to{opacity:1;transform:none}}
#intro{position:fixed;inset:0;z-index:50;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;animation:introOut .9s 2.1s forwards;perspective:900px}
#intro .lp{background:#fff;border-radius:18px;padding:12px 22px;animation:zoom 2.4s both cubic-bezier(.2,.8,.2,1);box-shadow:0 0 60px rgba(227,30,36,.35),0 0 0 1px #ddd}
#intro img{height:90px;display:block}
#intro p{letter-spacing:5px;color:#555;font-size:13px;animation:fade 2s .4s both;text-align:center;padding:0 12px}
@keyframes zoom{from{transform:translateZ(-900px) rotateY(80deg);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.4)}}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);perspective:1400px}
.ov.on{display:flex}
.panel{width:min(560px,94vw);max-height:92vh;overflow:auto;padding:26px;border-radius:24px;background:linear-gradient(150deg,#fff,#ececec);border:1px solid #ccc;color:#222;box-shadow:0 30px 80px rgba(0,0,0,.3),0 0 0 3px rgba(227,30,36,.15);animation:pin .7s both cubic-bezier(.2,.9,.2,1)}
@keyframes pin{from{opacity:0;transform:rotateY(-70deg) translateZ(-300px)}to{opacity:1;transform:none}}
.panel h2{margin-bottom:14px;font-size:20px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f .w{grid-column:1/-1}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;font:inherit;color:#222;background:#fff;border:1px solid #bbb;border-radius:10px;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--r)}
.act{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.msg{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:10px;display:none}
.msg.err{display:block;background:rgba(227,30,36,.12);border:1px solid rgba(227,30,36,.5)}
.msg.ok{display:block;background:rgba(40,160,100,.12);border:1px solid rgba(40,160,100,.5)}
.dl{display:grid;gap:10px;margin:14px 0}.dl div{padding:10px 12px;border-radius:10px;background:#f1f1f1}.dl small{display:block;color:var(--mut);font-size:11px}
a{color:#b3181d}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:8px}
@keyframes sway{0%,100%{transform:rotateY(-16deg) rotateX(6deg)}50%{transform:rotateY(16deg) rotateX(-6deg)}}
@keyframes bob{0%,100%{transform:translateY(-14px)}50%{transform:translateY(16px)}}
@keyframes cyc{0%,88%{opacity:1}97%,100%{opacity:0}}
.lE,.lW,.lB{transform-box:fill-box;transform-origin:center;opacity:0}
.lE{animation:fE 13s cubic-bezier(.2,.8,.2,1) infinite}.lW{animation:fW 13s cubic-bezier(.2,.8,.2,1) infinite}.lB{animation:fB 13s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes fE{0%{opacity:0;transform:translate(0,-440px) rotate(-220deg) scale(3.5)}6%{opacity:1}30%,100%{opacity:1;transform:none}}
@keyframes fW{0%,4%{opacity:0;transform:translate(-460px,260px) rotate(180deg) scale(3.5)}10%{opacity:1}36%,100%{opacity:1;transform:none}}
@keyframes fB{0%,8%{opacity:0;transform:translate(460px,260px) rotate(-180deg) scale(3.5)}14%{opacity:1}42%,100%{opacity:1;transform:none}}
.tri{stroke-dasharray:1040;stroke-dashoffset:1040;animation:dr 13s ease-in-out infinite}
@keyframes dr{0%,32%{stroke-dashoffset:1040}56%,100%{stroke-dashoffset:0}}
.rg{opacity:0;transform-box:fill-box;transform-origin:center;animation:rgA 13s ease-out infinite}
@keyframes rgA{0%,42%{opacity:0;transform:scale(.2)}60%,100%{opacity:1;transform:none}}
.tx{opacity:0;animation:txA 13s infinite}
@keyframes txA{0%,58%{opacity:0}70%,100%{opacity:1}}
@media (max-width:640px){header{flex-wrap:wrap;padding:10px 14px}.ttl b{font-size:16px}#stage{padding:16px 14px 60px}.bar{padding:14px 14px 4px}.f{grid-template-columns:1fr}}
</style></head><body>
<canvas id="bg"></canvas>
<div id="bgLogo"><div class="spin"><svg viewBox="0 0 427 468" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#6a6a6a" stroke-width="17"><circle class="rg" cx="150" cy="238" r="62"/><circle class="rg" cx="278" cy="238" r="62"/></g><polygon class="tri" points="213,38 44,340 383,340" fill="none" stroke="#ed1c24" stroke-width="16" stroke-linejoin="miter"/><g font-family="Arial Black,Impact,Arial,sans-serif" font-weight="900" font-size="46" fill="#111" text-anchor="middle"><text class="lE" x="213" y="165">E</text><text class="lW" x="162" y="258">W</text><text class="lB" x="265" y="258">B</text></g><text class="tx" x="213" y="375" text-anchor="middle" font-family="Arial Narrow,Arial,sans-serif" font-weight="700" font-size="28" fill="#111" textLength="356" lengthAdjust="spacingAndGlyphs">ENGINEERS WITHOUT BORDERS</text><rect class="tx" x="33" y="383" width="362" height="3" fill="#ed1c24"/></svg></div></div>
<div class="vig"></div>
<div id="intro"><div class="lp"><img class="lg" alt="EWB"></div><p>ENGINEERS WITHOUT BORDERS &middot; CONTRACTORS AND SUPPLIERS</p></div>
<div id="app">
<header><div class="logoPlate"><img class="lg" alt="EWB"></div>
<div class="ttl"><b>Engineers Without Borders <em style="font-style:normal;color:#e31e24">CONTRACTORS AND SUPPLIERS</em></b><span>Muscat, Sultanate of Oman</span></div>

<div class="f">
<div class="w"><label>Company name *</label><input id="fN"></div>
<div><label>Category * (type a new one to create it)</label><input id="fC" list="cl"><datalist id="cl"></datalist></div>
<div><label>Contact person</label><input id="fP"></div>
<div><label>Phone</label><input id="fT"></div>
<div><label>Email</label><input id="fE"></div>
<div><label>Rating</label><input id="fR"></div>
<div><label>Start date</label><input id="fS"></div>

<div class="w"><label>Scope of work</label><textarea id="fW" rows="2"></textarea></div>
<div class="w"><label>Notes</label><textarea id="fO" rows="2"></textarea></div>

<script>
/* ---- connection to the EWB Google Sheet (Apps Script web app, JSON API) ---- */
var API="https://script.google.com/macros/s/AKfycbytO-AD_cPbYIuck7_cyAUbmG6SuMguR1RVT4JDzbhAQP8f9H7J6xd9gfcj9I8apAM/exec";
var CATS=[];
function mkRun(sh,fh){
 var run={
  withSuccessHandler:function(f){return mkRun(f,fh)},
  withFailureHandler:function(f){return mkRun(sh,f)},
  getCompanies:function(){
   fetch(API+"?action=list").then(function(r){return r.json()}).then(function(d){
    if(d.error)throw new Error(d.error);CATS=d.categories||[];sh&&sh(d.companies)}).catch(function(e){fh&&fh(e)})},
  getCategories:function(){sh&&sh(CATS)},
  addCompany:function(x){
   fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"add",data:x})})
    .then(function(r){return r.json()}).then(function(d){if(d.error)throw new Error(d.error);sh&&sh(d)}).catch(function(e){fh&&fh(e)})}
 };
 return run}
window.google={script:{run:mkRun(null,null)}};
/* ---- logo (header + intro) ---- */
var LSVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270"><polygon points="112,50 218,228 6,228" fill="#fff" stroke="#e31e24" stroke-width="16" stroke-linejoin="miter"/><ellipse cx="78" cy="168" rx="44" ry="36" fill="none" stroke="#6b6b6b" stroke-width="13"/><ellipse cx="148" cy="168" rx="44" ry="36" fill="none" stroke="#6b6b6b" stroke-width="13"/><g font-family="Arial,sans-serif" font-weight="900" font-size="34" fill="#111" text-anchor="middle"><text x="112" y="125">E</text><text x="80" y="180">W</text><text x="148" y="180">B</text></g><rect x="222" y="140" width="574" height="5" fill="#e31e24"/><text x="796" y="128" text-anchor="end" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#222">مهندسون بلا حدود للإستشارات الهندسية</text><text x="224" y="182" font-family="Arial,sans-serif" font-size="30" fill="#222" textLength="572" lengthAdjust="spacingAndGlyphs"><tspan fill="#e31e24" font-size="38" font-weight="700">E</tspan>NGINEERS <tspan fill="#e31e24" font-size="38" font-weight="700">W</tspan>ITHOUT <tspan fill="#e31e24" font-size="38" font-weight="700">B</tspan>ORDERS CONSULTANTS</text></svg>';
var LOGO="data:image/svg+xml;utf8,"+encodeURIComponent(LSVG);
var DATA=[],CAT='',allowDup=false,logoObj=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
Array.prototype.forEach.call(document.querySelectorAll('.lg'),function(im){im.src=LOGO});
/* ---------- 3D background ---------- */
var cv=$('bg'),cx=cv.getContext('2d'),W,H,P=[],mx=0,my=0;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(var i=0;i<110;i++)P.push({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()});
addEventListener('mousemove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;$('grid').style.transform='rotateY('+(mx*5)+'deg) rotateX('+(-my*3)+'deg)'});
function frame(t){
 cx.clearRect(0,0,W,H);var g=cx.createRadialGradient(W/2,H*.2,0,W/2,H*.4,H);g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#f3f3f3');g.addColorStop(1,'#d6d6d6');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 var hz=H*(.42+my*.05),cxm=W/2+mx*80;cx.lineWidth=1;
 for(var i=-20;i<=20;i++){cx.strokeStyle='rgba(90,90,90,'+(0.22-Math.abs(i)*.008)+')';cx.beginPath();cx.moveTo(cxm+i*18,hz);cx.lineTo(cxm+i*W*.16,H);cx.stroke()}
 var off=(t/1400)%1;
 for(var j=0;j<14;j++){var k=(j+off)/14,y=hz+Math.pow(k,2.2)*(H-hz);cx.strokeStyle='rgba(227,30,36,'+(0.05+k*.28)+')';cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
 for(var n=0;n<P.length;n++){var p=P[n];p.z-=.0016;if(p.z<=.02){p.z=1;p.x=Math.random()*2-1;p.y=Math.random()*2-1}
  var sx=W/2+(p.x/p.z)*W*.18-mx*60*(1-p.z),sy=H/2+(p.y/p.z)*H*.18-my*60*(1-p.z),s=(1-p.z)*3+.3;
  cx.fillStyle='rgba('+(n%7?'120,120,120':'255,90,95')+','+(1-p.z)*.8+')';cx.beginPath();cx.arc(sx,sy,s,0,6.3);cx.fill()}
 requestAnimationFrame(frame)}requestAnimationFrame(frame);
/* ---------- data ---------- */
function ini(n){var w=String(n).trim().split(/\s+/);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()}
function render(){
 var q=$('q').value.trim().toLowerCase(),out=[];
 DATA.forEach(function(c){if(CAT&&c.cat!==CAT)return;if(q&&(c.name+' '+c.cat+' '+c.contact+' '+c.phone+' '+c.email+' '+c.scope+' '+c.address+' '+c.notes).toLowerCase().indexOf(q)<0)return;out.push(c)});
 $('cnt').textContent=out.length;
 var h=out.slice(0,300).map(function(c,i){
  var av=c.logo?'<img src="'+esc(c.logo)+'" alt="'+esc(ini(c.name))+'" onerror="this.parentNode.textContent=this.alt">':esc(ini(c.name));
  return '<div class="card" data-i="'+c.idx+'" style="animation-delay:'+Math.min(i,24)*45+'ms"><div class="shine"></div><div class="top"><div class="av">'+av+'</div><div><div class="nm">'+esc(c.name)+'</div><span class="ct">'+esc(c.cat||'-')+'</span></div></div><div class="rows">'+(c.contact?'<div>&#128100; <b>'+esc(c.contact)+'</b></div>':'')+(c.phone?'<div>&#9742; '+esc(c.phone)+'</div>':'')+(c.email?'<div>&#9993; '+esc(c.email)+'</div>':'')+(c.rating?'<div>&#9733; '+esc(c.rating)+'</div>':'')+'</div></div>'}).join('');
 $('grid').innerHTML=h||'<div class="empty">No companies match your search</div>';
 Array.prototype.forEach.call(document.querySelectorAll('.card'),tilt)}
function tilt(el){
 el.addEventListener('mousemove',function(e){var r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  el.style.transform='perspective(900px) rotateY('+((x-.5)*22)+'deg) rotateX('+((.5-y)*18)+'deg) translateZ(40px) scale(1.03)';el.style.setProperty('--mx',x*100+'%');el.style.setProperty('--my',y*100+'%')});
 el.addEventListener('mouseleave',function(){el.style.transform=''});
 el.addEventListener('click',function(){detail(DATA[+el.getAttribute('data-i')])})}
function chips(){var cs={};DATA.forEach(function(c){if(c.cat)cs[c.cat]=(cs[c.cat]||0)+1});
 var h='<div class="chip'+(CAT?'':' on')+'" data-c="">All</div>'+Object.keys(cs).sort().map(function(k){return '<div class="chip'+(CAT===k?' on':'')+'" data-c="'+esc(k)+'">'+esc(k)+' ('+cs[k]+')</div>'}).join('');
 $('chips').innerHTML=h;Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){c.onclick=function(){CAT=c.getAttribute('data-c');chips();render()}})}
function detail(c){
 function row(l,v){return v?'<div><small>'+l+'</small>'+v+'</div>':''}
 $('det').innerHTML='<h2>'+esc(c.name)+'</h2><span class="ct">'+esc(c.cat)+'</span><div class="dl">'+row('Contact person',esc(c.contact))+row('Phone',c.phone?'<a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a>':'')+row('Email',c.email?'<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':'')+row('Rating',esc(c.rating))+row('Address',esc(c.address))+row('Scope of work',esc(c.scope))+row('Start date',esc(c.start))+row('Notes',esc(c.notes))+'</div><div class="act"><button class="btn ghost" id="delD" style="color:#b3181d;border-color:#b3181d">Delete company</button><button class="btn" id="clD">Close</button></div>';
 $('delD').onclick=function(){if(!confirm('Delete "'+c.name+'"? / حذف الشركة؟'))return;var b=$('delD');b.disabled=true;b.textContent='Deleting...';
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'delete',data:{id:c.id||'',name:c.name}})}).then(function(r){return r.json()}).then(function(d){if(d.error)throw new Error(d.error);$('ovD').classList.remove('on');load()}).catch(function(e){b.disabled=false;b.textContent='Delete company';alert(e.message)})};
 $('ovD').classList.add('on');$('clD').onclick=function(){$('ovD').classList.remove('on')}}
$('ovD').onclick=function(e){if(e.target===this)this.classList.remove('on')};
function load(){
 $('grid').innerHTML='<div class="empty">Loading companies...</div>';
 google.script.run.withSuccessHandler(function(r){DATA=r.map(function(c,i){c.idx=i;return c});chips();render()}).withFailureHandler(function(e){$('grid').innerHTML='<div class="empty">Could not load data: '+esc(e.message)+'</div>'}).getCompanies()}
$('q').oninput=render;$('rf').onclick=load;
/* ---------- add ---------- */
function msg(t,k){var m=$('msg');m.className='msg '+k;m.textContent=t}
$('add').onclick=function(){$('msg').className='msg';allowDup=false;$('dup').style.display='none';logoObj=null;['fN','fC','fP','fT','fE','fR','fS','fA','fW','fO','fL'].forEach(function(i){$(i).value=''});
 $('cl').innerHTML=CATS.map(function(x){return '<option value="'+esc(x)+'">'}).join('');$('ovA').classList.add('on')};
$('cx').onclick=function(){$('ovA').classList.remove('on')};
$('fL').onchange=function(){var f=this.files[0];if(!f){logoObj=null;return}var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);logoObj={mimeType:'image/png',data:c.toDataURL('image/png').split(',')[1]}};im.src=r.result};r.readAsDataURL(f)};
function save(){
 var f={CompanyName:$('fN').value.trim(),Category:$('fC').value.trim(),ContactPerson:$('fP').value,Phone:$('fT').value,Email:$('fE').value,Rating:$('fR').value,StartDate:$('fS').value,Address:$('fA').value,ScopeOfWork:$('fW').value,Notes:$('fO').value,logo:logoObj,allowDuplicate:allowDup};
 if(!f.CompanyName||!f.Category){msg('Company name and category are required.','err');return}
 $('sv').disabled=true;msg('Saving...','ok');
 google.script.run.withSuccessHandler(function(r){$('sv').disabled=false;
  if(r&&r.duplicate){msg('A similar company already exists. Press "Add anyway" to save it as a new record.','err');$('dup').style.display='';return}
  msg('Saved successfully'+(r.warning?' ('+r.warning+')':'')+'.','ok');setTimeout(function(){$('ovA').classList.remove('on');load()},900)}).withFailureHandler(function(e){$('sv').disabled=false;msg(e.message,'err')}).addCompany(f)}
$('sv').onclick=save;$('dup').onclick=function(){allowDup=true;save()};
load();
</script></body></html>
