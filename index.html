<script>
/* ---- connection to the EWB Google Sheet (Apps Script web app, JSON API) ---- */
var API="https://script.google.com/macros/s/AKfycbytO-AD_cPbYIuck7_cyAUbmG6SuMguR1RVT4JDzbhAQP8f9H7J6xd9gfcj9I8apAM/exec";
var CATS=[];
function mkRun(sh,fh){
 var run={
  withSuccessHandler:function(f){return mkRun(f,fh)},
  withFailureHandler:function(f){return mkRun(sh,f)},
  getCompanies:function(){
   fetch(API+"?action=list").then(function(r){return r.json()}).then(function(d){
    if(d.error)throw new Error(d.error);CATS=d.categories||[];sh&&sh(d.companies)}).catch(function(e){fh&&fh(e)})},
  getCategories:function(){sh&&sh(CATS)},
  addCompany:function(x){
   fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"add",data:x})})
    .then(function(r){return r.json()}).then(function(d){if(d.error)throw new Error(d.error);sh&&sh(d)}).catch(function(e){fh&&fh(e)})}
 };
 return run}
